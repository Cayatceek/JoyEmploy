{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2 class="my-4">Manage Employees</h2>
    <a href="{% url 'register_employee' %}" class="btn btn-primary mb-3">Add New Employee</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{ employee.id }}</td>
                <td>{{ employee.name }}</td>
                <td>{{ employee.role.name }}</td>
                <td>{{ employee.user.email }}</td>
                <td>
                    <a href="{% url 'update_role' employee.id %}" class="btn btn-warning btn-sm">Update Role</a>
                    <a href="{% url 'delete_user' employee.id %}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
