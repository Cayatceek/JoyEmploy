{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Update Role for {{ employee.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <label for="role">Select Role:</label>
        <select name="role">
            {% for role in roles %}
            <option value="{{ role.name }}" {% if role == employee.role %}selected{% endif %}>{{ role.name }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-success">Update Role</button>
    </form>
</div>
{% endblock %}
