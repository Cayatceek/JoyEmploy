{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="my-4">Dashboard</h1>

    <div class="row">
        <!-- Список сотрудников -->
        <div class="col-md-6">
            <h3>Сотрудники</h3>
            <ul class="list-group">
                {% for employee in employees %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ employee.name }} ({{ employee.role.name }})
                    </li>
                {% endfor %}

            </ul>
        </div>

        <!-- Список задач -->
        <div class="col-md-6">
            <h3>Задачи</h3>
            <ul class="list-group">
                {% for task in tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ task.title }}
                        <span class="badge bg-{% if task.status == 'done' %}success{% else %}warning{% endif %}">
                            {{ task.status }}
                        </span>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
